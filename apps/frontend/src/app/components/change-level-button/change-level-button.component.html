@if (!loading()) {
  <button
    type="button"
    class="w-full sm:w-auto px-4 py-2 rounded-pill border-2 border-sand-deep bg-paper hover:bg-paper-deep
           font-mono text-xs uppercase tracking-[0.15em] text-ink-soft hover:text-ink transition-colors
           focus-visible:outline-2 focus-visible:outline-detonation"
    (click)="onChangeLevel()">
    ☰ {{ 'action.changeLevel' | trans }}
  </button>
} @else {
  <button
    type="button"
    disabled
    class="w-full sm:w-auto px-4 py-2 rounded-pill border-2 border-sand-deep bg-paper-deep
           font-mono text-xs uppercase tracking-[0.15em] text-ink-soft
           flex justify-center items-center gap-2 cursor-not-allowed">
    <app-loading-spinner class="size-4 text-ink-soft"></app-loading-spinner>
    <span>{{ 'loading' | trans }}</span>
  </button>
}
