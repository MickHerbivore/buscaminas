<article
  class="relative w-full max-w-5xl bg-paper border-2 border-ink rounded-card shadow-stencil
         p-4 sm:p-6 flex flex-col gap-4 mx-auto">

  <!-- HUD stencil -->
  <header
    class="flex items-center justify-between gap-4 pb-3 border-b border-sand-deep"
    aria-label="Estado de la partida">
    <div class="flex items-center gap-2 font-mono">
      <app-icon-flag class="size-4 text-detonation"></app-icon-flag>
      <span class="text-xl font-bold tabular-nums text-ink">{{ flagsPlaced() }}</span>
      <span class="text-ink-soft" aria-hidden="true">/</span>
      <span class="text-xl font-bold tabular-nums text-ink-soft">{{ numberOfMines() }}</span>
    </div>

    <div class="flex items-baseline gap-2 font-mono">
      <span class="hidden sm:inline text-[0.65rem] uppercase tracking-[0.2em] text-ink-soft">
        {{ 'hud.time' | trans }}
      </span>
      <app-timer></app-timer>
    </div>
  </header>

  <!-- Board -->
  <app-boxes-frame
    [level]="level()"
    [boxes]="boxes()"
    [hasWon]="hasWon()"
    [isGameOver]="isGameOver()"
    (boxClickedEvent)="boxClicked($event)"
    (boxRightClickEvent)="boxRightClicked($event)"></app-boxes-frame>

  <!-- Controls (ocultos mientras se muestra el overlay de resultado) -->
  @if (!isGameOver() && !hasWon()) {
    <div class="grid grid-cols-2 gap-2 sm:flex sm:gap-3 sm:justify-center">
      <app-reset-button></app-reset-button>
      <app-change-level-button></app-change-level-button>
    </div>
  }

  <!-- Result overlays con CTAs embebidos -->
  @if (isGameOver()) {
    <div
      role="status"
      aria-live="assertive"
      class="absolute inset-0 flex flex-col items-center justify-center gap-3 px-4
             bg-paper/95 backdrop-blur-sm rounded-card
             animate-[fadeIn_0.2s_ease-out]">
      <app-icon-mine class="size-12 text-detonation"></app-icon-mine>
      <h3 class="font-display font-bold text-3xl sm:text-4xl text-detonation tracking-tight">
        {{ 'result.lose' | trans }}
      </h3>
      <p class="font-mono text-xs text-ink-soft text-center px-4">{{ 'result.loseHint' | trans }}</p>
      <div class="flex flex-col gap-2 mt-3 w-full max-w-xs">
        <app-reset-button></app-reset-button>
        <app-change-level-button></app-change-level-button>
      </div>
    </div>
  }

  @if (hasWon()) {
    <div
      role="status"
      aria-live="assertive"
      class="absolute inset-0 flex flex-col items-center justify-center gap-3 px-4
             bg-paper/95 backdrop-blur-sm rounded-card
             animate-[fadeIn_0.2s_ease-out]">
      <app-icon-flag class="size-12 text-safe"></app-icon-flag>
      <h3 class="font-display font-bold text-3xl sm:text-4xl text-safe tracking-tight">
        {{ 'result.win' | trans }}
      </h3>
      <p class="font-mono text-xs text-ink-soft text-center px-4">{{ 'result.winHint' | trans }}</p>
      <div class="flex flex-col gap-2 mt-3 w-full max-w-xs">
        <app-reset-button></app-reset-button>
        <app-change-level-button></app-change-level-button>
      </div>
    </div>
  }
</article>
