<article
  class="relative w-fit max-w-full min-w-0 mx-auto bg-noche border-2 border-tinta rounded-card shadow-stencil
         p-4 sm:p-6 flex flex-col gap-4">

  <!-- HUD stencil -->
  <header
    class="flex items-center justify-between gap-4 pb-3 border-b border-trazo-suave"
    aria-label="Estado de la partida">
    <div class="flex items-center gap-2 font-mono">
      <app-icon-flag class="size-4 text-detonacion"></app-icon-flag>
      <span class="text-xl font-bold tabular-nums text-tinta">{{ flagsPlaced() }}</span>
      <span class="text-tinta-suave" aria-hidden="true">/</span>
      <span class="text-xl font-bold tabular-nums text-tinta-suave">{{ numberOfMines() }}</span>
    </div>

    <div class="flex items-baseline gap-2 font-mono">
      <span class="hidden sm:inline text-[0.65rem] uppercase tracking-[0.2em] text-tinta-suave">
        {{ 'hud.time' | trans }}
      </span>
      <app-timer></app-timer>
    </div>
  </header>

  <!-- Board -->
  <app-boxes-frame
    [level]="level()"
    [boxes]="boxes()"
    [hasWon]="hasWon()"
    [isGameOver]="isGameOver()"
    (boxClickedEvent)="boxClicked($event)"
    (boxRightClickEvent)="boxRightClicked($event)"></app-boxes-frame>

  <!-- Controls (ocultos mientras se muestra el overlay de resultado) -->
  @if (!isGameOver() && !hasWon()) {
    <div class="flex flex-col items-stretch gap-2 sm:flex-row sm:gap-3 sm:justify-center sm:items-center">
      <app-reset-button></app-reset-button>
      <app-change-level-button></app-change-level-button>
    </div>
  }

  <!-- Result overlays con CTAs embebidos -->
  @if (isGameOver()) {
    <div
      role="status"
      aria-live="assertive"
      class="absolute inset-0 flex flex-col items-center justify-center gap-3 px-4
             bg-noche/95 backdrop-blur-sm rounded-card
             animate-[fadeIn_0.2s_ease-out]">
      <app-icon-mine class="size-12 text-detonacion"></app-icon-mine>
      <h3 class="font-display font-bold text-3xl sm:text-4xl text-detonacion tracking-tight">
        {{ 'result.lose' | trans }}
      </h3>
      <p class="font-mono text-xs text-tinta-suave text-center px-4">{{ 'result.loseHint' | trans }}</p>
      <div class="flex flex-col gap-2 mt-3 w-full max-w-xs">
        <app-reset-button></app-reset-button>
        <app-change-level-button></app-change-level-button>
      </div>
    </div>
  }

  @if (hasWon()) {
    <app-confetti></app-confetti>
    <div
      role="status"
      aria-live="assertive"
      class="absolute inset-0 flex flex-col items-center justify-center gap-3 px-4
             bg-noche/95 backdrop-blur-sm rounded-card
             animate-[fadeIn_0.2s_ease-out]">
      <app-icon-flag class="size-12 text-esmeralda"></app-icon-flag>
      <h3 class="font-display font-bold text-3xl sm:text-4xl text-esmeralda tracking-tight">
        {{ 'result.win' | trans }}
      </h3>
      <p class="font-mono text-xs text-tinta-suave text-center px-4">{{ 'result.winHint' | trans }}</p>
      <div class="flex items-baseline gap-2 font-mono">
        <span class="text-[0.65rem] uppercase tracking-[0.2em] text-tinta-suave">
          {{ 'result.time' | trans }}
        </span>
        <app-timer></app-timer>
      </div>
      <div class="flex flex-col gap-2 mt-3 w-full max-w-xs">
        <app-reset-button></app-reset-button>
        <app-change-level-button></app-change-level-button>
      </div>
    </div>
  }
</article>
