<section
  class="relative w-full min-w-0 flex justify-center"
  [style.--cell-size]="cellSize()"
  [class.pointer-events-none]="isGameOver() || hasWon()">

  @if (boxes().length) {
    <div
      #scroller
      (scroll)="onScroll()"
      class="no-scrollbar max-w-full overflow-x-auto overscroll-x-contain pb-2"
      role="grid"
      [attr.aria-label]="'Tablero ' + (level()?.rowsQuantity ?? 0) + '×' + (level()?.columnsQuantity ?? 0)">

      <div class="inline-block">
        <div class="flex flex-col gap-px">
          @for (row of rows(); track $index) {
            <div class="flex" role="row">
              <div class="flex gap-px">
                @for (cell of row.cells; track cell.id) {
                  <app-box
                    [box]="cell"
                    (clickEvent)="boxClicked($event)"
                    (rightClickEvent)="boxRightClicked($event)"></app-box>
                }
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  }

  <div aria-hidden="true"
    class="pointer-events-none absolute inset-y-0 left-0 w-8 bg-noche/10 backdrop-blur-sm
           transition-opacity duration-200 [mask-image:linear-gradient(to_right,black,transparent)]"
    [class.opacity-0]="!shadowStart()" [class.opacity-100]="shadowStart()"></div>
  <div aria-hidden="true"
    class="pointer-events-none absolute inset-y-0 right-0 w-8 bg-noche/10 backdrop-blur-sm
           transition-opacity duration-200 [mask-image:linear-gradient(to_left,black,transparent)]"
    [class.opacity-0]="!shadowEnd()" [class.opacity-100]="shadowEnd()"></div>
</section>
