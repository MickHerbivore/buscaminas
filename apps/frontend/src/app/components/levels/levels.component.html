<section class="w-full flex flex-col gap-5" aria-labelledby="levels-heading">
  <header class="flex flex-col gap-1">
    <h2 id="levels-heading" class="font-display font-bold text-2xl tracking-tight">
      {{ 'levels.heading' | trans }}
    </h2>
    <p class="font-mono text-[0.7rem] uppercase tracking-[0.25em] text-ink-soft">
      {{ 'levels.subtitle' | trans }}
    </p>
  </header>

  @if (levelsLoading() && !levels().length) {
    <div class="flex justify-center py-10" role="status" aria-live="polite">
      <app-loading-spinner class="size-8 text-ink-soft"></app-loading-spinner>
    </div>
  } @else if (!levels().length) {
    <p class="font-mono text-sm text-ink-soft py-6 text-center">—</p>
  } @else {
    <ul class="flex flex-col gap-3" role="list">
      @for (level of levels(); track level.id) {
        <li>
          <button
            type="button"
            class="group w-full text-left bg-paper border-2 border-sand-deep rounded-card p-4
                   hover:border-ink hover:shadow-stencil-sm transition-all
                   disabled:opacity-50 disabled:cursor-not-allowed
                   flex items-center gap-4 min-w-0"
            (click)="onLevel(level)"
            [disabled]="submittedId() !== null"
            [attr.aria-label]="level.name">
            <span
              class="shrink-0 size-12 rounded-cell border-2 border-sand-deep
                     flex items-center justify-center font-mono font-bold text-base
                     text-ink-soft bg-paper-deep/40">
              {{ density(level) }}<span class="text-[0.6em] mt-[-2px]">%</span>
            </span>

            <span class="flex-1 flex flex-col gap-1 min-w-0">
              <span class="font-display font-bold text-lg leading-tight truncate text-ink">
                {{ level.name }}
              </span>
              <span class="font-mono text-xs text-ink-soft tracking-wide truncate">
                {{ level.rowsQuantity }}×{{ level.columnsQuantity }}
                · {{ level.minesQuantity }} {{ 'levels.mines' | trans }}
              </span>
            </span>

            @if (submittedId() === level.id) {
              <app-loading-spinner
                class="size-5 text-detonation shrink-0"
                aria-hidden="true"></app-loading-spinner>
            } @else {
              <span
                class="font-mono text-[0.65rem] uppercase tracking-[0.2em] text-ink-soft
                       group-hover:text-ink transition-colors shrink-0 hidden xs:inline">
                {{ 'action.start' | trans }}
              </span>
              <span
                class="font-mono text-base text-ink-soft group-hover:text-ink transition-colors shrink-0"
                aria-hidden="true">→</span>
            }
          </button>
        </li>
      }
    </ul>
  }
</section>
