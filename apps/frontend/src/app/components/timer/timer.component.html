<span
  class="font-mono font-bold tabular-nums text-xl text-ink whitespace-nowrap"
  [title]="elapsedDays() > 0 ? elapsedDays() + ' ' + ((elapsedDays() !== 1 ? 'days' : 'day')) : ''">
  @if (elapsedDays() > 0) {
    <span class="text-soft-ink text-base">·{{ elapsedDays() }}d</span>
  }
  {{ elapsedHours() }}:{{ elapsedMinutes() }}:{{ elapsedSeconds() }}
</span>
